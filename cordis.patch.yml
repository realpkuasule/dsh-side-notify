# Bundle patch layer for dsh-side-notify (companion to dsh-side-chat).
# Referenced by package.json `dsh.bundle.patch`, so `dsh plugin add`
# reconciles this package into the profile's bundle list and this row
# mounts the plugin. `name` is the package name: the Loader resolves it
# from the profile's node_modules.
- insert:
    - id: dsh-side-notify
      name: dsh-side-notify
